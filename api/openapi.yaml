openapi: 3.1.0
info:
  title: MoneyTrail API
  version: 0.1.0
  summary: Personal and shared expense tracking on top of a double-entry ledger.
  description: |
    Source of truth for the MoneyTrail API (spec-first, see docs/adr/0006-spec-first-openapi.md).
    The backend generates its Spring interfaces from this file and the frontend generates its
    TypeScript client from it. Errors use RFC 9457 problem details with a stable `code`.

    Operations that move money take the `Idempotency-Key` header
    (`#/components/parameters/IdempotencyKey`), so a retried request never records a movement
    twice, and list the `409` and `422` responses it can cause
    (`#/components/responses/IdempotencyKeyInUse` and `IdempotencyKeyReused`).
  license:
    name: MIT
    url: https://github.com/Muzachio/moneytrail/blob/main/LICENSE
servers:
  - url: /
    description: Same host that serves the API (the public domain is set up with the deployment).
tags:
  - name: system
    description: Service status.
  - name: identity
    description: The signed-in user.
  - name: accounts
    description: The signed-in user's checking, savings, cash and credit card accounts.
  - name: categories
    description: The signed-in user's expense and income categories.
  - name: transactions
    description: The signed-in user's expenses, income and transfers between their accounts.
  - name: reports
    description: Sums of the signed-in user's income and spending, for the dashboard.
  - name: groups
    description: The groups the signed-in user belongs to, where friends share expenses, and their members.
  - name: invites
    description: Invite links that let people join a group (docs/adr/0013-group-invites.md).
security:
  - sessionCookie: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Check that the API is up
      description: Public liveness check, used by the deployment to know the app started.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the signed-in user
      description: Returns the user of the current session. Without a session (or after sign-out) it returns 401.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List the user's accounts with their balances
      description: |
        Every checking, savings, cash and credit card account of the signed-in user, archived ones
        included, in the order they were created. Categories are not accounts here, and neither is
        the ledger's opening balances account. Each account comes with its balance and with how much
        it changed this month.
      responses:
        '200':
          description: The user's accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account, with its balance today if it has one
      description: |
        Adds an account. With an `openingBalance` the account starts at that balance: a journal
        entry dated today moves it from the user's `Equity:Opening balances` account, in the same
        transaction as the new account, so the ledger balances from the first entry. An opening
        balance of zero records no entry.

        It moves money, so it takes an `Idempotency-Key`: a retry gets the first response again and
        creates neither a second account nor a second entry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The new account, with its opening balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
  /v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Rename, archive or restore an account
      description: |
        Changes the properties sent and leaves the others as they are. An archived account keeps its
        history and its balance, but new transactions cannot use it. This moves no money, so it
        takes no `Idempotency-Key`: sending the same change again gives the same result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List the user's categories
      description: |
        Every expense and income category of the signed-in user, archived ones included. Expense
        categories come first, then income ones. Within each kind the default categories come first,
        in a fixed order, then the user's own in the order they were created.
      responses:
        '200':
          description: The user's categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      description: |
        Adds an expense or income category of the user's own, named by a `key` from the app's list
        or by a `name` of the user's. Creating a category moves no money, so it takes no
        `Idempotency-Key`: a retry of a request that succeeded answers `409`, because the name is
        then taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: The new category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
  /v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Rename a category, change its icon, archive or restore it
      description: |
        Changes the properties sent and leaves the others as they are. An archived category keeps
        its history, but new transactions cannot use it. Any category, a default one included, can be
        renamed with a `key` from the app's list, which the app then shows in each person's language,
        or with a `name`, which it shows as it is. Only a category of the user's own can change its
        icon: a default category keeps its icon, and sending `icon` for one answers `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: The category after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
  /v1/transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List a month's transactions, newest first, with the month's totals
      description: |
        The current version of each of the user's transactions in a month, newest first: by
        `occurredOn`, then by when they were recorded. Reversed transactions and old versions of
        edited ones are left out, and so are reversals and opening balances; an edited transaction
        shows its current version with `edited: true`.

        The filters combine: every one sent must match. A page holds at most `limit` transactions;
        when there are more, `nextCursor` is set, and sending it back as `cursor` with the same
        filters gives the next page. The cursor marks the last transaction of the page (keyset
        pagination on `occurredOn` and the id, never an offset), so a transaction recorded while
        paging is neither repeated nor skipped because of it.

        `summary` covers the whole month for the same filters, not only the page.
      parameters:
        - name: month
          in: query
          description: The calendar month, `YYYY-MM`. The current month in Europe/Lisbon when absent.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
        - name: type
          in: query
          description: Only expenses, only income or only transfers.
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          description: |
            Only the transactions of this account: expenses paid from it, income received in it and
            transfers from or to it.
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          description: Only the transactions of this category.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: |
            Only the transactions whose description contains this text, ignoring case. Spaces around
            it are removed; only spaces is the same as no `q`.
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: How many transactions a page holds at most.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of the month's transactions and the month's totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnknownFilter'
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record an expense, an income or a transfer
      description: |
        Records one money movement as a balanced journal entry of the user's ledger
        (docs/architecture.md, "The ledger"):

        - an expense debits its category and credits the account it was paid from
          (`+category −account`);
        - an income credits its category and debits the account it was received in
          (`−category +account`);
        - a transfer debits the account it goes to and credits the one it comes from
          (`+to −from`).

        Archived accounts and categories cannot be used. It moves money, so it takes an
        `Idempotency-Key`: a retry gets the first response again and records nothing twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransaction'
      responses:
        '201':
          description: The recorded transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/TransactionRefused'
  /v1/transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction with its postings and its trail
      description: |
        The transaction, the ledger postings it was recorded as, and its trail: every version of it
        and every reversal, oldest first. An old version of an edited transaction can be read too;
        it says that it was reversed and which version is the current one.
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
  /v1/transactions/{id}/reverse:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      operationId: reverseTransaction
      tags: [transactions]
      summary: Reverse a transaction, or edit it by reversing it and recording its correction
      description: |
        Nothing in the ledger is ever changed or deleted. Reversing posts a new entry that is the
        exact opposite of the transaction's, dated the same day and linked to it, so its accounts go
        back to what they would have been without it. Both entries stay in the history.

        With a `replacement`, the corrected transaction is recorded too, in the same database
        transaction as the reversal: this is how a transaction is edited. It follows the same rules as
        a new transaction, except that it may keep an archived account or category that the
        transaction it corrects already used. A transaction is reversed at most once, so reversing
        it again, or an old version of an edited one, answers `409`.

        It moves money, so it takes an `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReversal'
      responses:
        '200':
          description: |
            The correction when a `replacement` was sent, otherwise the reversed transaction; both
            with their trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/ReversalConflict'
        '422':
          $ref: '#/components/responses/TransactionRefused'
  /v1/reports/spending:
    get:
      operationId: getSpendingReport
      tags: [reports]
      summary: Sum a period's spending by category or by month
      description: |
        The user's income and spending from `from` to `to`, both days included, by expense category
        (this month's spending by category) or by calendar month (the six-month trend).

        Only expenses and income count: a transfer moves money between the user's own accounts, and
        an account's opening balance is money the user already had. Each transaction counts as it is
        now: a reversed one not at all, and an edited one with its corrected amount, category and day.
        The ledger never changes an entry, so this is how the sums come out by themselves: a reversal
        is the exact opposite of the entry it cancels, dated the same day, so the two add up to zero
        in any period that has one of them.
      parameters:
        - name: from
          in: query
          required: true
          description: The first day of the period.
          schema:
            type: string
            format: date
            example: '2026-06-01'
        - name: to
          in: query
          required: true
          description: The last day of the period, not before `from`.
          schema:
            type: string
            format: date
            example: '2026-11-30'
        - name: groupBy
          in: query
          required: true
          description: '`category` fills `categories`, `month` fills `months`.'
          schema:
            $ref: '#/components/schemas/ReportGrouping'
      responses:
        '200':
          description: The period's totals, and their breakdown by category or by month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingReport'
        '400':
          $ref: '#/components/responses/BadReportQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List the user's groups
      description: |
        Every group the signed-in user is a member of, archived ones included, in the order they
        were created. A group the user left is not listed.
      responses:
        '200':
          description: The user's groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group, with the user as its first member
      description: |
        Creates a group in one currency, which never changes (docs/adr/0012-groups-on-the-ledger.md).
        The group's ledger and the user's member account are opened in the same transaction, so a
        group never exists without them. Other people join through invite links.

        It takes an `Idempotency-Key` although it moves no money: groups may share a name, so a retry
        after a lost response would otherwise leave a second, empty group behind, with its own
        ledger.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '201':
          description: The new group, with the user as its only member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
  /v1/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group and its members
      description: |
        The group and its current members, each by name and photo. Members never see each other's
        email. Anyone who is not a member, someone who left included, gets `404`.
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/GroupNotFound'
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Rename, archive or restore a group
      description: |
        Any member may change the properties sent; the others stay as they are. A group can be
        archived only when every member's balance is zero. An archived group keeps its history and
        its members but takes no new expenses or payments until it is restored. This moves no money,
        so it takes no `Idempotency-Key`: sending the same change again gives the same result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/GroupNotFound'
        '409':
          $ref: '#/components/responses/GroupNotSettled'
  /v1/groups/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group
      description: |
        The user stops being a member, which they can only do with a balance of zero, so leaving
        never takes money out of the group. Their account and their part in past expenses stay, and
        they get the same account back if they join again. From then on the group answers `404` to
        them, as to anyone outside it, so leaving a second time answers `404` too. This moves no
        money, so it takes no `Idempotency-Key`.
      responses:
        '204':
          description: The user is no longer a member.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/GroupNotFound'
        '409':
          $ref: '#/components/responses/GroupNotSettled'
  /v1/groups/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listInvites
      tags: [invites]
      summary: List a group's active invite links
      description: |
        The group's links that still work, neither revoked nor expired, newest first, with who made
        each and when it expires. Never a token: only its SHA-256 is kept, so it cannot be shown again.
      responses:
        '200':
          description: The group's active links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/GroupNotFound'
    post:
      operationId: createInvite
      tags: [invites]
      summary: Make an invite link to the group
      description: |
        Any member can make a link. It works for 7 days, for any number of people, until it is
        revoked. The token is in this response only: the database keeps its SHA-256. The app puts it
        after the `#` of its join link (`/join#<token>`), so it never reaches a URL a server sees.

        It moves no money and takes no `Idempotency-Key`: a retry makes another link, which the list
        shows and any member can revoke.
      responses:
        '201':
          description: The new link, with its token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewInviteLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/GroupNotFound'
        '409':
          $ref: '#/components/responses/GroupArchived'
  /v1/groups/{id}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/InviteId'
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke an invite link
      description: |
        Any member can revoke one of the group's links. From then on its token gets the same answer as
        a token that never existed. Revoking it again answers `404`, like a link that expired.
      responses:
        '204':
          description: The link no longer works.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/InviteNotFound'
  /v1/invites/lookup:
    post:
      operationId: lookUpInvite
      tags: [invites]
      summary: See which group an invite link is for
      description: |
        What the join page shows before the person joins: the group, who invited them and how many
        members it has. The token goes in the body, never in a URL, and the person must be signed in,
        so a forwarded link tells someone the app does not let in nothing at all. It is a `POST`
        because the token must not be in the URL, but it changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteToken'
      responses:
        '200':
          description: The group the link is for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/InviteNotValid'
  /v1/invites/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Join a group through an invite link
      description: |
        Makes the signed-in person a member, with a member account in the group's ledger
        (docs/adr/0012-groups-on-the-ledger.md). Someone who left gets their old account back.
        Accepting again, or as a member, changes nothing and answers the same, so it takes no
        `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteToken'
      responses:
        '200':
          description: The group the person is now a member of.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/InviteNotValid'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SESSION
      description: Server-side session cookie set after Google sign-in (see docs/adr/0007-authentication.md).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value the client creates for one money-moving action, such as a random UUID, and sends
        again unchanged when it retries that action. Keys belong to the signed-in user, so two users
        never collide.

        The first request with a key that succeeds is stored with its response for at least 24
        hours. A retry with the same key, method, path and body then gets that response again, with
        the same status, headers and body, and nothing is recorded a second time. The same key with
        a different request answers `422`, and a retry while the first request is still running
        answers `409`. A request that fails stores nothing, so it can be retried with the same key.
        Without the header the request is refused with `400`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3f2b8c1e-7d4a-4b9e-9f0c-5a6d7e8f9a0b
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: There is no valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or breaks a rule of its schema, such as an empty name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: Invalid request content.
            code: bad_request
    AccountNotFound:
      description: |
        The user has no account with this id. Another user's account answers the same, so whether it
        exists is not revealed, and so do categories and the opening balances account, which are not
        accounts here.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no account with this id.
            code: account_not_found
    CategoryNotFound:
      description: |
        The user has no category with this id. Another user's category answers the same, so whether
        it exists is not revealed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no category with this id.
            code: category_not_found
    CategoryNameTaken:
      description: |
        Another active category of the same kind already has this name, ignoring case. A name from
        the app's list is compared by its English name (`CategoryKey`), so it is taken in every
        language. Archived categories do not count.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: An active expense category already has this name.
            code: category_name_taken
    IdempotencyKeyInUse:
      description: |
        Another request with the same `Idempotency-Key` is still being processed. Retry once it has
        finished: the retry then gets its response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: A request with this Idempotency-Key is still being processed. Retry when it has finished.
            code: idempotency_key_in_use
    IdempotencyKeyReused:
      description: |
        The `Idempotency-Key` was already used for a different request (another method, path or
        body). A new action needs a new key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: This Idempotency-Key was already used for a different request.
            code: idempotency_key_reused
    TransactionNotFound:
      description: |
        The user has no transaction with this id. Another user's transaction answers the same, so
        whether it exists is not revealed, and so do the entries that are not transactions: a
        reversal, which belongs to the trail of the transaction it cancels, and an account's opening
        balance.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no transaction with this id.
            code: transaction_not_found
    ReversalConflict:
      description: |
        `transaction_already_reversed`: the transaction was already reversed, by itself or by an
        edit, so it is not in effect any more; only the current version of an edited transaction can
        be reversed or edited. `idempotency_key_in_use`: see `IdempotencyKeyInUse`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: This transaction was already reversed.
            code: transaction_already_reversed
    TransactionRefused:
      description: |
        The request is well formed, but the transaction cannot be recorded. `code` says why:

        - `account_not_found`: the user has no account with this id. Another user's account
          answers the same, and so does a category or the opening balances account.
        - `category_not_found`: the user has no category with this id. Another user's category
          answers the same, and so does an account.
        - `category_kind_mismatch`: an expense needs an expense category, an income an income
          category.
        - `account_archived`, `category_archived`: archived accounts and categories cannot be
          used for new transactions.
        - `currency_mismatch`: the amount is not in the account's currency.
        - `idempotency_key_reused`: see `IdempotencyKeyReused`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: Category 0193f6a2-6b1e-7c4d-9a2f-3e5d7c9b1a20 is archived.
            code: category_archived
    UnknownFilter:
      description: |
        A filter names an account or a category the user does not have. `account_not_found`: no
        account with this id, and so for another user's account, a category or the opening balances
        account. `category_not_found`: no category with this id, and so for another user's category
        or an account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: There is no account 0193f6a2-6b1e-7c4d-9a2f-3e5d7c9b1a20.
            code: account_not_found
    BadReportQuery:
      description: |
        `bad_request`: a parameter is missing or breaks its schema, such as a day that is not
        `YYYY-MM-DD` or an unknown `groupBy`. `invalid_period`: `to` is before `from`, or the period
        covers more than 24 calendar months.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: The period ends on 2026-05-31, before it starts on 2026-06-01.
            code: invalid_period
    GroupNotFound:
      description: |
        The user is not a member of a group with this id: there is none, it belongs to other people,
        or the user left it. All of them answer the same, so whether a group exists is not revealed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no group with this id.
            code: group_not_found
    GroupNotSettled:
      description: |
        `group_not_settled`: a group can be archived only when every member's balance is zero.
        `member_not_settled`: a member can leave only with a balance of zero.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: Your balance in this group is not zero.
            code: member_not_settled
    GroupArchived:
      description: An archived group takes no new members, so no new invite links, until it is restored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: This group is archived.
            code: group_archived
    InviteNotFound:
      description: |
        `group_not_found`: as for the group's other operations. `invite_not_found`: the group has no
        active link with this id: there is none, it belongs to another group, it was revoked or it
        expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: This group has no active invite link with this id.
            code: invite_not_found
    InviteNotValid:
      description: |
        The token opens no group: no link has it, or its link was revoked, expired, or belongs to a
        group that was archived. All of them answer the same, so trying tokens teaches nothing about
        which ones exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: This invite link no longer works.
            code: invite_not_found
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
          description: Always `UP` when the API answers.
    CurrentUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          description: Profile picture from the identity provider, when it has one.
    Money:
      type: object
      required: [amountMinor, currency]
      description: |
        An amount in the minor units of a currency: `{"amountMinor": 1250, "currency": "EUR"}` is
        €12.50. Never a decimal number (docs/architecture.md, "API").
      properties:
        amountMinor:
          type: integer
          format: int64
          # JavaScript's safe integers (2^53 − 1), so that every client reads the amount exactly.
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Whole minor units, such as cents. Negative for money owed or spent.
          example: 1250
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code.
          example: EUR
    CurrencyCode:
      type: string
      enum: [EUR]
      description: The currency of an account or a group. Only EUR for now; more currencies come later.
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, CREDIT_CARD]
      description: |
        What the account is. Checking, savings and cash accounts hold money the user has (assets in
        the ledger); a credit card holds money the user owes (a liability).
    AccountName:
      type: string
      minLength: 1
      maxLength: 50
      # The same rule as CategoryName: at least one character that is not a space.
      pattern: '^\s*\S[\s\S]*$'
      description: Spaces around the name are removed. Two accounts may have the same name.
      example: Everyday checking
    Account:
      type: object
      required: [id, name, type, currency, balance, changeThisMonth, archived]
      description: |
        An `ASSET` or `LIABILITY` account of the user's personal ledger (docs/architecture.md, "The
        ledger"). Amounts are signed as the ledger keeps them: what the user has is positive, and
        what they owe, such as a credit card's balance, is negative.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Everyday checking
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        balance:
          $ref: '#/components/schemas/Money'
          description: The sum of every entry on the account, the opening balance included.
        changeThisMonth:
          $ref: '#/components/schemas/Money'
          description: |
            The sum of the account's entries dated in the current calendar month (Europe/Lisbon). The
            opening balance is left out: it is money the user already had, not money that moved.
        archived:
          type: boolean
          description: Archived accounts keep their history and balance but cannot be used for new transactions.
        archivedAt:
          type: string
          format: date-time
          description: When the account was archived; only on archived accounts.
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    NewAccount:
      type: object
      required: [name, type, currency]
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        openingBalance:
          $ref: '#/components/schemas/Money'
          description: |
            The account's balance today ("Balance today" in the app), in the account's currency and
            signed as `balance` is: what a credit card owes ("Amount owed today") is negative. Leave
            it out, or send zero, for an account that starts empty.
    AccountUpdate:
      type: object
      minProperties: 1
      description: The properties to change, at least one.
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        archived:
          type: boolean
          description: '`true` archives the account, `false` restores it.'
    CategoryKind:
      type: string
      enum: [EXPENSE, INCOME]
      description: Whether the category is for spending or for income.
    CategoryName:
      type: string
      minLength: 1
      maxLength: 50
      # At least one character that is not a space. Anchored, so it means the same to JavaScript,
      # which searches, and to Java's validator, which matches the whole value.
      pattern: '^\s*\S[\s\S]*$'
      description: Spaces around the name are removed.
      example: Pilates classes
    CategoryKey:
      type: string
      # The first twelve are the default categories'. A new key needs a migration too: the database
      # checks the list (V12).
      enum:
        - housing
        - food
        - transport
        - bills
        - shopping
        - leisure
        - health
        - other
        - salary
        - refunds
        - gifts
        - other-income
        - groceries
        - restaurants
        - rent
        - condo-fees
        - electricity
        - water
        - gas
        - phone-internet
        - subscriptions
        - fuel
        - tolls
        - insurance
        - pharmacy
        - personal-care
        - clothes
        - gym
        - education
        - kids
        - pets
        - travel
        - gifts-given
        - taxes
        - freelance
        - bonus
        - interest
        - dividends
        - holiday-allowance
        - christmas-allowance
        - sales
        - pension
      description: |
        A category name the app knows, which it shows in each person's language. Each key is for one
        kind. Expenses: `housing` (Housing), `food` (Food), `transport` (Transport), `bills` (Bills),
        `shopping` (Shopping), `leisure` (Leisure), `health` (Health), `other` (Other), `groceries`
        (Groceries), `restaurants` (Restaurants), `rent` (Rent), `condo-fees` (Condo fees),
        `electricity` (Electricity), `water` (Water), `gas` (Gas), `phone-internet` (Phone and
        internet), `subscriptions` (Subscriptions), `fuel` (Fuel), `tolls` (Tolls), `insurance`
        (Insurance), `pharmacy` (Pharmacy), `personal-care` (Personal care), `clothes` (Clothes),
        `gym` (Gym), `education` (Education), `kids` (Kids), `pets` (Pets), `travel` (Travel),
        `gifts-given` (Gifts) and `taxes` (Taxes). Income: `salary` (Salary), `refunds` (Refunds),
        `gifts` (Gifts), `other-income` (Other income), `freelance` (Freelance), `bonus` (Bonus),
        `interest` (Interest), `dividends` (Dividends), `holiday-allowance` (Holiday allowance),
        `christmas-allowance` (Christmas allowance), `sales` (Sales) and `pension` (Pension).

        The English name in brackets is the one the rule against repeated names compares, so a
        known name is taken in every language at once: while the default `food` is active, neither
        `key` `food` nor `name` "Food" can be given to another expense category.
      example: groceries
    CategoryIcon:
      type: string
      # The first eleven are the default categories' icons (design canvas), the rest are for the
      # user's own. A new name needs a migration too: the database checks the list (V11).
      enum:
        - house
        - utensils
        - tram-front
        - receipt
        - shopping-bag
        - ticket
        - heart
        - tag
        - banknote
        - rotate-ccw
        - gift
        - car
        - fuel
        - plane
        - coffee
        - shirt
        - smartphone
        - graduation-cap
        - baby
        - paw-print
        - dumbbell
        - wrench
        - piggy-bank
        - briefcase
      description: |
        The picture the app shows next to a category, by its name in Lucide (lucide.dev), the app's
        icon set. A default category keeps the icon it starts with, whatever its name later: the
        default `housing` has `house`, `food` `utensils`, `transport` `tram-front`, `bills`
        `receipt`, `shopping` `shopping-bag`, `leisure` `ticket`, `health` `heart`, `other` and
        `other-income` `tag`, `salary` `banknote`, `refunds` `rotate-ccw` and `gifts` `gift`. A
        category of the user's own has the one picked for it, from the whole list.
      example: utensils
    Category:
      type: object
      required: [id, kind, default, icon, archived]
      description: |
        An `EXPENSE` or `INCOME` account of the user's personal ledger (docs/architecture.md, "The
        ledger"). It has either a `key`, which the app shows in the person's language, or a `name`,
        which it shows as it is, never both; and `icon` next to it.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CategoryKind'
        key:
          $ref: '#/components/schemas/CategoryKey'
          description: |
            When the category's name is one the app knows: a default category until it gets another
            name, and any category that was given one with `key`. The app translates it, so each
            person sees it in their own language.
        name:
          type: string
          description: |
            When the category's name is one the user typed, which the app shows as it is in every
            language.
          example: Pilates classes
        default:
          type: boolean
          description: |
            One of the categories every ledger starts with. It keeps its icon, and the list shows the
            defaults first, whatever their names.
        icon:
          $ref: '#/components/schemas/CategoryIcon'
          description: |
            A default category's own icon. For one of the user's own, the icon picked for it, or
            `tag` if none was.
        archived:
          type: boolean
          description: Archived categories keep their history but cannot be used for new transactions.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    NewCategory:
      type: object
      required: [kind]
      description: |
        Send `key` or `name`, one of them: both, or neither, answer `400`. The app sends `key` when
        the name the person typed is one it knows in the language it is showing.
      properties:
        kind:
          $ref: '#/components/schemas/CategoryKind'
        key:
          $ref: '#/components/schemas/CategoryKey'
          description: A key of this kind, the defaults' included. One of the other kind answers `400`.
        name:
          $ref: '#/components/schemas/CategoryName'
        icon:
          $ref: '#/components/schemas/CategoryIcon'
          description: Any icon of the list. Leave it out for `tag`.
    CategoryUpdate:
      type: object
      minProperties: 1
      description: |
        The properties to change, at least one. `key` and `name` both rename the category, so only
        one of them can be sent.
      properties:
        key:
          $ref: '#/components/schemas/CategoryKey'
          description: |
            A key of the category's kind: the app then shows its translation. Giving a default
            category its own key back makes it translated again after a `name`.
        name:
          $ref: '#/components/schemas/CategoryName'
        icon:
          $ref: '#/components/schemas/CategoryIcon'
          description: |
            Only for a category of the user's own. A default category keeps its icon, so sending one
            for it answers `400`.
        archived:
          type: boolean
          description: '`true` archives the category, `false` restores it.'
    TransactionType:
      type: string
      enum: [EXPENSE, INCOME, TRANSFER]
      description: |
        What the transaction is. A transfer moves money between two of the user's own accounts, so it
        is neither spending nor income.
    PositiveMoney:
      type: object
      required: [amountMinor, currency]
      description: A `Money` above zero.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Whole minor units, such as cents.
          example: 1250
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code, the account's currency.
          example: EUR
    TransactionDescription:
      type: string
      minLength: 1
      maxLength: 200
      # The same rule as CategoryName: at least one character that is not a space.
      pattern: '^\s*\S[\s\S]*$'
      description: What the money was for. Spaces around it are removed.
      example: Groceries
    NewTransaction:
      type: object
      required: [type, amount, occurredOn, description]
      description: |
        An expense or an income takes `categoryId` and `accountId`; a transfer takes `fromAccountId`
        and `toAccountId`, two different accounts. The properties of the other type are refused with
        `400`.
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
          description: How much moved, always above zero; `type` says in which direction.
        occurredOn:
          type: string
          format: date
          description: The day the money moved, which can be in the past.
          example: '2026-10-22'
        description:
          $ref: '#/components/schemas/TransactionDescription'
        categoryId:
          type: string
          format: uuid
          description: An expense category for an expense, an income category for an income.
        accountId:
          type: string
          format: uuid
          description: The account an expense was paid from, or an income was received in.
        fromAccountId:
          type: string
          format: uuid
          description: The account a transfer takes the money from.
        toAccountId:
          type: string
          format: uuid
          description: The account a transfer puts the money in.
    TransactionReversal:
      type: object
      description: Send no body, or no `replacement`, to reverse the transaction without correcting it.
      properties:
        replacement:
          $ref: '#/components/schemas/NewTransaction'
          description: The corrected transaction, recorded together with the reversal.
    Transaction:
      type: object
      required: [id, type, amount, occurredOn, description, recordedAt, edited, reversed]
      description: |
        One version of an expense, an income or a transfer: a journal entry of the user's ledger.
        Expenses and income come with `categoryId` and `accountId`, transfers with `fromAccountId`
        and `toAccountId`. Look the ids up in the user's categories and accounts, archived ones
        included.
      properties:
        id:
          type: string
          format: uuid
          description: The id of the journal entry.
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
          description: How much moved, above zero; `type` says in which direction.
        occurredOn:
          type: string
          format: date
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
          description: When this version was recorded.
        edited:
          type: boolean
          description: This version is the correction of an earlier one.
        reversed:
          type: boolean
          description: |
            A later entry cancelled this version, on its own or as part of an edit. Only old versions
            are reversed: the current version of a transaction never is.
    Posting:
      type: object
      required: [accountId, amount]
      description: One line of a journal entry. The postings of an entry add up to zero.
      properties:
        accountId:
          type: string
          format: uuid
          description: One of the user's accounts or categories.
        amount:
          $ref: '#/components/schemas/Money'
          description: A debit when positive, a credit when negative (docs/architecture.md, "The ledger").
    TrailAction:
      type: string
      enum: [RECORDED, REVERSED, CORRECTED]
      description: |
        `RECORDED`: the first version. `REVERSED`: an entry that cancels the step before it.
        `CORRECTED`: a later version, recorded together with the reversal before it.
    TrailStep:
      type: object
      required: [entryId, action, type, amount, recordedAt]
      properties:
        entryId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/TrailAction'
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
          description: The amount of the version, or of the version a reversal cancels.
        recordedAt:
          type: string
          format: date-time
        reversesEntryId:
          type: string
          format: uuid
          description: Only on `REVERSED` steps, the entry they cancel.
    TransactionDetail:
      type: object
      required: [transaction, postings, trail]
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        postings:
          type: array
          description: The ledger postings this version was recorded as.
          items:
            $ref: '#/components/schemas/Posting'
        trail:
          type: array
          description: |
            Every version of the transaction and every reversal, oldest first. A transaction that was
            never edited or reversed has one step.
          items:
            $ref: '#/components/schemas/TrailStep'
        currentId:
          type: string
          format: uuid
          description: |
            The version in effect, which may be this one. Absent when the last version was reversed
            without a correction.
    TransactionPage:
      type: object
      required: [month, summary, items]
      properties:
        month:
          type: string
          description: The month listed, `YYYY-MM`, also when the request left it out.
          example: '2026-10'
        summary:
          $ref: '#/components/schemas/MonthSummary'
        items:
          type: array
          description: The current version of each transaction, newest first.
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type: string
          description: Send it as `cursor` for the next page. Absent on the last page.
    MonthSummary:
      type: object
      required: [count, income, spending, net]
      description: |
        The whole month's transactions that match the filters, not only the page's. Transfers count
        as transactions but add nothing to income, spending or net: they only move money between
        the user's own accounts.
      properties:
        count:
          type: integer
          format: int64
          description: How many transactions match, transfers included.
          example: 41
        income:
          $ref: '#/components/schemas/Money'
          description: The sum of the income, zero or more.
        spending:
          $ref: '#/components/schemas/Money'
          description: The sum of the expenses, zero or more.
        net:
          $ref: '#/components/schemas/Money'
          description: '`income` minus `spending`: negative when more was spent than received.'
    ReportGrouping:
      type: string
      enum: [category, month]
      description: How a report breaks its totals down.
    SpendingReport:
      type: object
      required: [income, spending]
      description: |
        The period's totals, whatever the grouping, and one breakdown: `categories` with
        `groupBy=category`, `months` with `groupBy=month`. The other one is absent.
      properties:
        income:
          $ref: '#/components/schemas/Money'
          description: What the income categories received in the period, zero or more.
        spending:
          $ref: '#/components/schemas/Money'
          description: |
            What was spent in the expense categories in the period, zero or more: the sum of
            `categories`, or of the months' `spending`.
        categories:
          type: array
          description: |
            Each expense category with spending in the period, archived ones included, largest
            first; on a tie, the one created first comes first. A category with nothing spent in the
            period is left out.
          items:
            $ref: '#/components/schemas/CategorySpending'
        months:
          type: array
          description: |
            Every calendar month the period touches, oldest first, a month without movements
            included with zeros. The first and the last month only count the days in the period, so
            a trend that ends today ends with this month so far.
          items:
            $ref: '#/components/schemas/MonthTotals'
    CategorySpending:
      type: object
      required: [categoryId, icon, spending]
      description: |
        How much one expense category got in the period. It has either a `key`, which the app shows
        in the person's language, or a `name`, which it shows as it is, and `icon` next to it, as a
        `Category` does.
      properties:
        categoryId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/CategoryKey'
          description: As `Category.key`.
        name:
          type: string
          description: As `Category.name`.
          example: Pilates classes
        icon:
          $ref: '#/components/schemas/CategoryIcon'
          description: As `Category.icon`.
        spending:
          $ref: '#/components/schemas/Money'
          description: Above zero.
    MonthTotals:
      type: object
      required: [month, income, spending]
      properties:
        month:
          type: string
          description: The calendar month, `YYYY-MM`.
          example: '2026-10'
        income:
          $ref: '#/components/schemas/Money'
          description: What the income categories received in the month's days of the period.
        spending:
          $ref: '#/components/schemas/Money'
          description: What was spent in the expense categories in the month's days of the period.
    GroupName:
      type: string
      minLength: 1
      maxLength: 50
      # The same rule as AccountName: at least one character that is not a space.
      pattern: '^\s*\S[\s\S]*$'
      description: Spaces around the name are removed. Two groups may have the same name.
      example: Porto weekend
    NewGroup:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/GroupName'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency of every amount in the group, EUR when left out. It never changes.
    GroupUpdate:
      type: object
      minProperties: 1
      description: The properties to change, at least one.
      properties:
        name:
          $ref: '#/components/schemas/GroupName'
        archived:
          type: boolean
          description: '`true` archives the group, which needs every balance at zero; `false` restores it.'
    GroupSummary:
      type: object
      required: [id, name, currency, memberCount, archived]
      description: A group in the list of the user's groups.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Porto weekend
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        memberCount:
          type: integer
          format: int32
          minimum: 1
          description: How many people are members now, the user included.
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          description: When the group was archived; only on archived groups.
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
    Group:
      type: object
      required: [id, name, currency, archived, createdAt, members]
      description: |
        A group and its current members (docs/adr/0012-groups-on-the-ledger.md). Every amount in it is
        in `currency`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Porto weekend
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        archived:
          type: boolean
          description: An archived group keeps its history but takes no new expenses or payments.
        archivedAt:
          type: string
          format: date-time
          description: When the group was archived; only on archived groups.
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          description: The current members, in the order they joined. Someone who left is not listed.
          items:
            $ref: '#/components/schemas/GroupMember'
    GroupMember:
      type: object
      required: [userId, name, joinedAt]
      description: A member as the other members see them, by name and photo. Never their email.
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
          description: The name from the member's Google account.
          example: Ana
        avatarUrl:
          type: string
          format: uri
          description: Profile picture from the identity provider, when it has one.
        joinedAt:
          type: string
          format: date-time
    Profile:
      type: object
      required: [userId, name]
      description: Someone as other people see them, by name and photo. Never their email.
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
          example: Rita
        avatarUrl:
          type: string
          format: uri
          description: Profile picture from the identity provider, when it has one.
    InviteToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          # 32 random bytes in base64url without padding.
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The token from the link's fragment, after `#`.
          example: mTq4b9Vx2KcR7sLwE1pZ0yH5nJ3aG8fUoQ6dWtXiB_c
    NewInviteLink:
      type: object
      required: [id, token, createdAt, expiresAt]
      description: A link just made. The token is shown here only.
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: 32 random bytes in base64url (43 characters), to put after `#` in the join link.
          example: mTq4b9Vx2KcR7sLwE1pZ0yH5nJ3aG8fUoQ6dWtXiB_c
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 7 days after `createdAt`.
    InviteLink:
      type: object
      required: [id, createdBy, createdAt, expiresAt]
      description: An active link of the group, without its token, which is not kept.
      properties:
        id:
          type: string
          format: uuid
        createdBy:
          $ref: '#/components/schemas/Profile'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InviteLink'
    InvitePreview:
      type: object
      required: [groupName, currency, memberCount, invitedBy, alreadyMember]
      description: What a valid link leads to, for the join page.
      properties:
        groupName:
          type: string
          example: Porto weekend
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        memberCount:
          type: integer
          format: int32
          minimum: 1
        invitedBy:
          $ref: '#/components/schemas/Profile'
          description: The member who made the link.
        alreadyMember:
          type: boolean
          description: The signed-in person is a member already; accepting changes nothing.
    Problem:
      type: object
      description: RFC 9457 problem details, plus a stable `code` that clients can rely on.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: Stable, machine-readable error code, e.g. `unauthenticated`.
