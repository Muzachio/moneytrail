name: Review

# An automated review of each pull request against CLAUDE.md and its issue (#77), following
# .github/pr-review.md. It advises and the maintainer decides: it is not a required check on
# main, so a failed or missing review never blocks a merge.
#
# Needs the Claude GitHub App installed on this repository and the repository secret
# CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`: runs use the maintainer's Claude
# subscription, not API billing. When the token expires, make a new one and replace the secret.
#
# It reviews once, when a pull request opens or leaves draft. To review it again after new
# commits, close and reopen the pull request.
on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened]

# id-token lets the action sign in as the Claude GitHub App.
permissions:
  contents: read
  issues: read
  pull-requests: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Not for drafts or bots (Renovate's updates). Nor for pull requests from forks: GitHub gives
    # them no secrets, so the action could not sign in.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned by commit to a release at least three days old, like Renovate's
      # minimumReleaseAge: the major tag moves with every release.
      - name: Review the pull request
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following `.github/pr-review.md`. The pull request is
            checked out in the working directory.

            Post each finding tied to a line as an inline comment with
            `mcp__github_inline_comment__create_inline_comment`, then post the summary as a single
            comment with `gh pr comment`. Post nothing else.
          # It can read the code, the pull request and its issue, and comment; nothing more.
          # --max-turns caps a run's length and cost: raise it if large pull requests get cut short.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
