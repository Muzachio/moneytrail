spring:
  application:
    name: moneytrail
  config:
    # Local secrets (the Google OAuth client) live in backend/.env, which git ignores.
    # .env.example lists the keys.
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            # The placeholders let the app start before an OAuth client exists; signing in then
            # fails at Google. Production requires real values (application-prod.yml).
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile
  session:
    jdbc:
      # Flyway owns the schema (V3__spring_session.sql).
      initialize-schema: never
  jpa:
    # Services return records, not entities, so nothing loads lazily while the response is written.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks at startup that the entities match it.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        # Only health: env, beans, configprops and friends would leak configuration.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          # Not ready to take traffic while the database is unreachable.
          include: readinessState,db
  tracing:
    sampling:
      # Low traffic: keep every trace.
      probability: 1.0
  otlp:
    metrics:
      export:
        # Off unless a collector exists (observability profile locally, Grafana Cloud in
        # production); otherwise every export attempt would log a connection error.
        enabled: false
