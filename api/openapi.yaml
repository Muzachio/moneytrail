openapi: 3.1.0
info:
  title: MoneyTrail API
  version: 0.1.0
  summary: Personal and shared expense tracking on top of a double-entry ledger.
  description: |
    Source of truth for the MoneyTrail API (spec-first, see docs/adr/0006-spec-first-openapi.md).
    The backend generates its Spring interfaces from this file and the frontend generates its
    TypeScript client from it. Errors use RFC 9457 problem details with a stable `code`.

    Operations that move money take the `Idempotency-Key` header
    (`#/components/parameters/IdempotencyKey`), so a retried request never records a movement
    twice, and list the `409` and `422` responses it can cause
    (`#/components/responses/IdempotencyKeyInUse` and `IdempotencyKeyReused`).
  license:
    name: MIT
    url: https://github.com/Muzachio/moneytrail/blob/main/LICENSE
servers:
  - url: /
    description: Same host that serves the API (the public domain is set up with the deployment).
tags:
  - name: system
    description: Service status.
  - name: identity
    description: The signed-in user.
  - name: accounts
    description: The signed-in user's checking, savings, cash and credit card accounts.
  - name: categories
    description: The signed-in user's expense and income categories.
  - name: transactions
    description: The signed-in user's expenses, income and transfers between their accounts.
security:
  - sessionCookie: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Check that the API is up
      description: Public liveness check, used by the deployment to know the app started.
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the signed-in user
      description: Returns the user of the current session. Without a session (or after sign-out) it returns 401.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List the user's accounts with their balances
      description: |
        Every checking, savings, cash and credit card account of the signed-in user, archived ones
        included, in the order they were created. Categories are not accounts here, and neither is
        the ledger's opening balances account. Each account comes with its balance and with how much
        it changed this month.
      responses:
        '200':
          description: The user's accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account, with its balance today if it has one
      description: |
        Adds an account. With an `openingBalance` the account starts at that balance: a journal
        entry dated today moves it from the user's `Equity:Opening balances` account, in the same
        transaction as the new account, so the ledger balances from the first entry. An opening
        balance of zero records no entry.

        It moves money, so it takes an `Idempotency-Key`: a retry gets the first response again and
        creates neither a second account nor a second entry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: The new account, with its opening balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
  /v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Rename, archive or restore an account
      description: |
        Changes the properties sent and leaves the others as they are. An archived account keeps its
        history and its balance, but new transactions cannot use it. This moves no money, so it
        takes no `Idempotency-Key`: sending the same change again gives the same result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List the user's categories
      description: |
        Every expense and income category of the signed-in user, archived ones included. Expense
        categories come first, then income ones. Within each kind the default categories come first,
        in a fixed order, then the user's own in the order they were created.
      responses:
        '200':
          description: The user's categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      description: |
        Adds an expense or income category of the user's own. Creating a category moves no money,
        so it takes no `Idempotency-Key`: a retry of a request that succeeded answers `409`, because
        the name is then taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: The new category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
  /v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Rename, archive or restore a category
      description: |
        Changes the properties sent and leaves the others as they are. An archived category keeps
        its history, but new transactions cannot use it. Renaming a default category makes the app
        show the new name instead of its translation of `key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: The category after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
  /v1/transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List a month's transactions, newest first, with the month's totals
      description: |
        The current version of each of the user's transactions in a month, newest first: by
        `occurredOn`, then by when they were recorded. Reversed transactions and old versions of
        edited ones are left out, and so are reversals and opening balances; an edited transaction
        shows its current version with `edited: true`.

        The filters combine: every one sent must match. A page holds at most `limit` transactions;
        when there are more, `nextCursor` is set, and sending it back as `cursor` with the same
        filters gives the next page. The cursor marks the last transaction of the page (keyset
        pagination on `occurredOn` and the id, never an offset), so a transaction recorded while
        paging is neither repeated nor skipped because of it.

        `summary` covers the whole month for the same filters, not only the page.
      parameters:
        - name: month
          in: query
          description: The calendar month, `YYYY-MM`. The current month in Europe/Lisbon when absent.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
        - name: type
          in: query
          description: Only expenses, only income or only transfers.
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          description: |
            Only the transactions of this account: expenses paid from it, income received in it and
            transfers from or to it.
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          description: Only the transactions of this category.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: |
            Only the transactions whose description contains this text, ignoring case. Spaces around
            it are removed; only spaces is the same as no `q`.
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: How many transactions a page holds at most.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of the month's transactions and the month's totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnknownFilter'
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record an expense, an income or a transfer
      description: |
        Records one money movement as a balanced journal entry of the user's ledger
        (docs/architecture.md, "The ledger"):

        - an expense debits its category and credits the account it was paid from
          (`+category −account`);
        - an income credits its category and debits the account it was received in
          (`−category +account`);
        - a transfer debits the account it goes to and credits the one it comes from
          (`+to −from`).

        Archived accounts and categories cannot be used. It moves money, so it takes an
        `Idempotency-Key`: a retry gets the first response again and records nothing twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransaction'
      responses:
        '201':
          description: The recorded transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: '#/components/responses/TransactionRefused'
  /v1/transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction with its postings and its trail
      description: |
        The transaction, the ledger postings it was recorded as, and its trail: every version of it
        and every reversal, oldest first. An old version of an edited transaction can be read too;
        it says that it was reversed and which version is the current one.
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
  /v1/transactions/{id}/reverse:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      operationId: reverseTransaction
      tags: [transactions]
      summary: Reverse a transaction, or edit it by reversing it and recording its correction
      description: |
        Nothing in the ledger is ever changed or deleted. Reversing posts a new entry that is the
        exact opposite of the transaction's, dated the same day and linked to it, so its accounts go
        back to what they would have been without it. Both entries stay in the history.

        With a `replacement`, the corrected transaction is recorded too, in the same database
        transaction as the reversal: this is how a transaction is edited. It follows the same rules as
        a new transaction, except that it may keep an archived account or category that the
        transaction it corrects already used. A transaction is reversed at most once, so reversing
        it again, or an old version of an edited one, answers `409`.

        It moves money, so it takes an `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReversal'
      responses:
        '200':
          description: |
            The correction when a `replacement` was sent, otherwise the reversed transaction; both
            with their trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/ReversalConflict'
        '422':
          $ref: '#/components/responses/TransactionRefused'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SESSION
      description: Server-side session cookie set after Google sign-in (see docs/adr/0007-authentication.md).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value the client creates for one money-moving action, such as a random UUID, and sends
        again unchanged when it retries that action. Keys belong to the signed-in user, so two users
        never collide.

        The first request with a key that succeeds is stored with its response for at least 24
        hours. A retry with the same key, method, path and body then gets that response again, with
        the same status, headers and body, and nothing is recorded a second time. The same key with
        a different request answers `422`, and a retry while the first request is still running
        answers `409`. A request that fails stores nothing, so it can be retried with the same key.
        Without the header the request is refused with `400`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 3f2b8c1e-7d4a-4b9e-9f0c-5a6d7e8f9a0b
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: There is no valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or breaks a rule of its schema, such as an empty name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: Invalid request content.
            code: bad_request
    AccountNotFound:
      description: |
        The user has no account with this id. Another user's account answers the same, so whether it
        exists is not revealed, and so do categories and the opening balances account, which are not
        accounts here.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no account with this id.
            code: account_not_found
    CategoryNotFound:
      description: |
        The user has no category with this id. Another user's category answers the same, so whether
        it exists is not revealed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no category with this id.
            code: category_not_found
    CategoryNameTaken:
      description: |
        Another active category of the same kind already has this name, ignoring case. Archived
        categories do not count.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: An active expense category already has this name.
            code: category_name_taken
    IdempotencyKeyInUse:
      description: |
        Another request with the same `Idempotency-Key` is still being processed. Retry once it has
        finished: the retry then gets its response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: A request with this Idempotency-Key is still being processed. Retry when it has finished.
            code: idempotency_key_in_use
    IdempotencyKeyReused:
      description: |
        The `Idempotency-Key` was already used for a different request (another method, path or
        body). A new action needs a new key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: This Idempotency-Key was already used for a different request.
            code: idempotency_key_reused
    TransactionNotFound:
      description: |
        The user has no transaction with this id. Another user's transaction answers the same, so
        whether it exists is not revealed, and so do the entries that are not transactions: a
        reversal, which belongs to the trail of the transaction it cancels, and an account's opening
        balance.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: There is no transaction with this id.
            code: transaction_not_found
    ReversalConflict:
      description: |
        `transaction_already_reversed`: the transaction was already reversed, by itself or by an
        edit, so it is not in effect any more; only the current version of an edited transaction can
        be reversed or edited. `idempotency_key_in_use`: see `IdempotencyKeyInUse`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: This transaction was already reversed.
            code: transaction_already_reversed
    TransactionRefused:
      description: |
        The request is well formed, but the transaction cannot be recorded. `code` says why:

        - `account_not_found`: the user has no account with this id. Another user's account
          answers the same, and so does a category or the opening balances account.
        - `category_not_found`: the user has no category with this id. Another user's category
          answers the same, and so does an account.
        - `category_kind_mismatch`: an expense needs an expense category, an income an income
          category.
        - `account_archived`, `category_archived`: archived accounts and categories cannot be
          used for new transactions.
        - `currency_mismatch`: the amount is not in the account's currency.
        - `idempotency_key_reused`: see `IdempotencyKeyReused`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: Category 0193f6a2-6b1e-7c4d-9a2f-3e5d7c9b1a20 is archived.
            code: category_archived
    UnknownFilter:
      description: |
        A filter names an account or a category the user does not have. `account_not_found`: no
        account with this id, and so for another user's account, a category or the opening balances
        account. `category_not_found`: no category with this id, and so for another user's category
        or an account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Content
            status: 422
            detail: There is no account 0193f6a2-6b1e-7c4d-9a2f-3e5d7c9b1a20.
            code: account_not_found
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
          description: Always `UP` when the API answers.
    CurrentUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          description: Profile picture from the identity provider, when it has one.
    Money:
      type: object
      required: [amountMinor, currency]
      description: |
        An amount in the minor units of a currency: `{"amountMinor": 1250, "currency": "EUR"}` is
        €12.50. Never a decimal number (docs/architecture.md, "API").
      properties:
        amountMinor:
          type: integer
          format: int64
          # JavaScript's safe integers (2^53 − 1), so that every client reads the amount exactly.
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Whole minor units, such as cents. Negative for money owed or spent.
          example: 1250
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code.
          example: EUR
    CurrencyCode:
      type: string
      enum: [EUR]
      description: The currency of an account. Only EUR for now; more currencies come later.
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, CREDIT_CARD]
      description: |
        What the account is. Checking, savings and cash accounts hold money the user has (assets in
        the ledger); a credit card holds money the user owes (a liability).
    AccountName:
      type: string
      minLength: 1
      maxLength: 50
      # The same rule as CategoryName: at least one character that is not a space.
      pattern: '^\s*\S[\s\S]*$'
      description: Spaces around the name are removed. Two accounts may have the same name.
      example: Everyday checking
    Account:
      type: object
      required: [id, name, type, currency, balance, changeThisMonth, archived]
      description: |
        An `ASSET` or `LIABILITY` account of the user's personal ledger (docs/architecture.md, "The
        ledger"). Amounts are signed as the ledger keeps them: what the user has is positive, and
        what they owe, such as a credit card's balance, is negative.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Everyday checking
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        balance:
          $ref: '#/components/schemas/Money'
          description: The sum of every entry on the account, the opening balance included.
        changeThisMonth:
          $ref: '#/components/schemas/Money'
          description: |
            The sum of the account's entries dated in the current calendar month (Europe/Lisbon). The
            opening balance is left out: it is money the user already had, not money that moved.
        archived:
          type: boolean
          description: Archived accounts keep their history and balance but cannot be used for new transactions.
        archivedAt:
          type: string
          format: date-time
          description: When the account was archived; only on archived accounts.
    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    NewAccount:
      type: object
      required: [name, type, currency]
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        openingBalance:
          $ref: '#/components/schemas/Money'
          description: |
            The account's balance today ("Balance today" in the app), in the account's currency and
            signed as `balance` is: what a credit card owes ("Amount owed today") is negative. Leave
            it out, or send zero, for an account that starts empty.
    AccountUpdate:
      type: object
      minProperties: 1
      description: The properties to change, at least one.
      properties:
        name:
          $ref: '#/components/schemas/AccountName'
        archived:
          type: boolean
          description: '`true` archives the account, `false` restores it.'
    CategoryKind:
      type: string
      enum: [EXPENSE, INCOME]
      description: Whether the category is for spending or for income.
    CategoryName:
      type: string
      minLength: 1
      maxLength: 50
      # At least one character that is not a space. Anchored, so it means the same to JavaScript,
      # which searches, and to Java's validator, which matches the whole value.
      pattern: '^\s*\S[\s\S]*$'
      description: Spaces around the name are removed.
      example: Groceries
    Category:
      type: object
      required: [id, kind, archived]
      description: |
        An `EXPENSE` or `INCOME` account of the user's personal ledger (docs/architecture.md, "The
        ledger"). Show `name` when it is present, otherwise the app's translation of `key`.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CategoryKind'
        key:
          type: string
          description: |
            Only on the default categories, and it never changes: `housing`, `food`, `transport`,
            `bills`, `shopping`, `leisure`, `health` and `other` for expenses, `salary`, `refunds`,
            `gifts` and `other-income` for income. The app translates it and picks an icon from it.
          example: food
        name:
          type: string
          description: |
            The name the user gave the category. A default category has none until the user renames
            it, so each person sees it in their own language.
          example: Groceries
        archived:
          type: boolean
          description: Archived categories keep their history but cannot be used for new transactions.
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    NewCategory:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: '#/components/schemas/CategoryKind'
        name:
          $ref: '#/components/schemas/CategoryName'
    CategoryUpdate:
      type: object
      minProperties: 1
      description: The properties to change, at least one.
      properties:
        name:
          $ref: '#/components/schemas/CategoryName'
        archived:
          type: boolean
          description: '`true` archives the category, `false` restores it.'
    TransactionType:
      type: string
      enum: [EXPENSE, INCOME, TRANSFER]
      description: |
        What the transaction is. A transfer moves money between two of the user's own accounts, so it
        is neither spending nor income.
    PositiveMoney:
      type: object
      required: [amountMinor, currency]
      description: A `Money` above zero.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Whole minor units, such as cents.
          example: 1250
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code, the account's currency.
          example: EUR
    TransactionDescription:
      type: string
      minLength: 1
      maxLength: 200
      # The same rule as CategoryName: at least one character that is not a space.
      pattern: '^\s*\S[\s\S]*$'
      description: What the money was for. Spaces around it are removed.
      example: Groceries
    NewTransaction:
      type: object
      required: [type, amount, occurredOn, description]
      description: |
        An expense or an income takes `categoryId` and `accountId`; a transfer takes `fromAccountId`
        and `toAccountId`, two different accounts. The properties of the other type are refused with
        `400`.
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
          description: How much moved, always above zero; `type` says in which direction.
        occurredOn:
          type: string
          format: date
          description: The day the money moved, which can be in the past.
          example: '2026-10-22'
        description:
          $ref: '#/components/schemas/TransactionDescription'
        categoryId:
          type: string
          format: uuid
          description: An expense category for an expense, an income category for an income.
        accountId:
          type: string
          format: uuid
          description: The account an expense was paid from, or an income was received in.
        fromAccountId:
          type: string
          format: uuid
          description: The account a transfer takes the money from.
        toAccountId:
          type: string
          format: uuid
          description: The account a transfer puts the money in.
    TransactionReversal:
      type: object
      description: Send no body, or no `replacement`, to reverse the transaction without correcting it.
      properties:
        replacement:
          $ref: '#/components/schemas/NewTransaction'
          description: The corrected transaction, recorded together with the reversal.
    Transaction:
      type: object
      required: [id, type, amount, occurredOn, description, recordedAt, edited, reversed]
      description: |
        One version of an expense, an income or a transfer: a journal entry of the user's ledger.
        Expenses and income come with `categoryId` and `accountId`, transfers with `fromAccountId`
        and `toAccountId`. Look the ids up in the user's categories and accounts, archived ones
        included.
      properties:
        id:
          type: string
          format: uuid
          description: The id of the journal entry.
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
          description: How much moved, above zero; `type` says in which direction.
        occurredOn:
          type: string
          format: date
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
          description: When this version was recorded.
        edited:
          type: boolean
          description: This version is the correction of an earlier one.
        reversed:
          type: boolean
          description: |
            A later entry cancelled this version, on its own or as part of an edit. Only old versions
            are reversed: the current version of a transaction never is.
    Posting:
      type: object
      required: [accountId, amount]
      description: One line of a journal entry. The postings of an entry add up to zero.
      properties:
        accountId:
          type: string
          format: uuid
          description: One of the user's accounts or categories.
        amount:
          $ref: '#/components/schemas/Money'
          description: A debit when positive, a credit when negative (docs/architecture.md, "The ledger").
    TrailAction:
      type: string
      enum: [RECORDED, REVERSED, CORRECTED]
      description: |
        `RECORDED`: the first version. `REVERSED`: an entry that cancels the step before it.
        `CORRECTED`: a later version, recorded together with the reversal before it.
    TrailStep:
      type: object
      required: [entryId, action, type, amount, recordedAt]
      properties:
        entryId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/TrailAction'
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
          description: The amount of the version, or of the version a reversal cancels.
        recordedAt:
          type: string
          format: date-time
        reversesEntryId:
          type: string
          format: uuid
          description: Only on `REVERSED` steps, the entry they cancel.
    TransactionDetail:
      type: object
      required: [transaction, postings, trail]
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        postings:
          type: array
          description: The ledger postings this version was recorded as.
          items:
            $ref: '#/components/schemas/Posting'
        trail:
          type: array
          description: |
            Every version of the transaction and every reversal, oldest first. A transaction that was
            never edited or reversed has one step.
          items:
            $ref: '#/components/schemas/TrailStep'
        currentId:
          type: string
          format: uuid
          description: |
            The version in effect, which may be this one. Absent when the last version was reversed
            without a correction.
    TransactionPage:
      type: object
      required: [month, summary, items]
      properties:
        month:
          type: string
          description: The month listed, `YYYY-MM`, also when the request left it out.
          example: '2026-10'
        summary:
          $ref: '#/components/schemas/MonthSummary'
        items:
          type: array
          description: The current version of each transaction, newest first.
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type: string
          description: Send it as `cursor` for the next page. Absent on the last page.
    MonthSummary:
      type: object
      required: [count, income, spending, net]
      description: |
        The whole month's transactions that match the filters, not only the page's. Transfers count
        as transactions but add nothing to income, spending or net: they only move money between
        the user's own accounts.
      properties:
        count:
          type: integer
          format: int64
          description: How many transactions match, transfers included.
          example: 41
        income:
          $ref: '#/components/schemas/Money'
          description: The sum of the income, zero or more.
        spending:
          $ref: '#/components/schemas/Money'
          description: The sum of the expenses, zero or more.
        net:
          $ref: '#/components/schemas/Money'
          description: '`income` minus `spending`: negative when more was spent than received.'
    Problem:
      type: object
      description: RFC 9457 problem details, plus a stable `code` that clients can rely on.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: Stable, machine-readable error code, e.g. `unauthenticated`.
