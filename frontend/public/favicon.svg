<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- MoneyTrail's logo: a trail between two points that draws an M, ending higher than it
       starts. Shown in the app too (the sign-in page, the header). The PNG icons are made from
       this file: `npm run generate:icons`. -->
  <rect width="32" height="32" rx="8" fill="#171717"/>
  <path d="M7 23C8.4 19 9.4 13.5 11 13.5C12.8 13.5 13.8 19 15.6 19C17.6 19 18.6 9 20.6 9C22.4 9 24 13.5 25 17" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7" cy="23" r="2.5" fill="#34d399"/>
  <circle cx="25" cy="17" r="2.5" fill="#34d399"/>
</svg>
